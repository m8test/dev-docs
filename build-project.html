}</script><!-- End Schema.org --></head><body data-id="build-project" data-main-title="构建项目" data-article-props="{&quot;seeAlsoStyle&quot;:&quot;links&quot;}" data-template="article" data-breadcrumbs="project-based.md|项目化"><div class="wrapper"><main class="panel _main"><header class="panel__header"><div class="container"><h3>M8Test  Help</h3><div class="panel-trigger"></div></div></header><section class="panel__content"><div class="container"><article class="article" data-shortcut-switcher="inactive"><h1 data-toc="build-project" id="build-project.md">构建项目</h1><p id="-m62kej_3">如果一个文件夹是脚本项目的话会显示一个 gradle 的图标, 如下所示, 点击图标进入构建项目页面</p><figure id="-m62kej_4"><img alt="23" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/23.png" title="23"></figure><p id="-m62kej_5">点击右上角的图标开始构建项目</p><figure id="-m62kej_6"><img alt="24" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/24.png" title="24"></figure><p id="-m62kej_7">如果构建过程中没有错误信息则表示构建成功, 如下图所示, 类似于 gradle 的同步功能</p><figure id="-m62kej_8"><img alt="25" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/25.png" title="25"></figure><p id="-m62kej_9">点击项目按钮并展开项目</p><figure id="-m62kej_10"><img alt="26" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/26.png" title="26"></figure><p id="-m62kej_11">再点击任务按钮显示所有的任务分组</p><figure id="-m62kej_12"><img alt="27" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/27.png" title="27"></figure><p id="-m62kej_13">点击任务分组左边的按钮展开分组后可以看到分组内的所有任务, 类似于 gradle 的任务</p><figure id="-m62kej_14"><img alt="28" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/28.png" title="28"></figure><p id="-m62kej_15">点击任务中的运行按钮即可执行任务</p><figure id="-m62kej_16"><img alt="29" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/29.png" title="29"></figure><div class="last-modified">Last modified: 11 April 2025</div><div data-feedback-placeholder="true"></div><div class="navigation-links _bottom"><a href="project-development.html" class="navigation-links__prev">开发项目</a><a href="builder-api.html" class="navigation-links__next">构建脚本 Api</a></div></article><div id="disqus_thread"></div></div></section></main></div><script src="https://resources.jetbrains.com/writerside/apidoc/6.22.0-b725/app.js"></script></body></html>
