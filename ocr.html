<script src="static/search.js"></script></head><body data-id="ocr" data-main-title="光学字符识别" data-article-props="{&quot;seeAlsoStyle&quot;:&quot;links&quot;}" data-template="article" data-breadcrumbs=""><div class="wrapper"><main class="panel _main"><header class="panel__header"><div class="container"><h3>M8Test  Help</h3><div class="panel-trigger"></div></div></header><section class="panel__content"><div class="container"><article class="article" data-shortcut-switcher="inactive"><h1 data-toc="ocr" id="ocr.md">光学字符识别</h1><p id="kauqol_3">OCR（Optical Character Recognition，光学字符识别）是一种能够将图像中的文字信息转换为计算机可读取和处理的文本字符串的技术。</p><p id="kauqol_4">在安卓自动化测试场景中，OCR技术使自动化脚本能够识别特定区域的文字并将识别结果用于后续断言或操作, 简单来说，OCR让测试脚本能够&quot;看懂&quot;屏幕上的文字，即使这些文字不是标准的UI控件。</p><p id="kauqol_5">M8Test 提供的 ocr 组件实现了以下三种 OCR :</p><ul class="list _bullet" id="kauqol_6"><li class="list__item" id="kauqol_7"><p id="kauqol_10"><a href="baidu-ocr.html" id="kauqol_11" data-tooltip="使用百度OCR前，需先在百度智能云创建应用。">百度OCR</a></p></li><li class="list__item" id="kauqol_8"><p id="kauqol_12"><a href="paddle-ocr.html" id="kauqol_13" data-tooltip="模型文件可通过以下链接下载：">Paddle OCR</a></p></li><li class="list__item" id="kauqol_9"><p id="kauqol_14"><a href="tesseract-ocr.html" id="kauqol_15" data-tooltip="模型文件可通过以下渠道下载：">Tesseract OCR</a></p></li></ul><div class="last-modified">09 December 2025</div><div data-feedback-placeholder="true"></div><div class="navigation-links _bottom"><a href="color-functions.html" class="navigation-links__prev">颜色函数</a><a href="baidu-ocr.html" class="navigation-links__next">百度OCR</a></div></article><div id="disqus_thread"></div></div></section></main></div><script src="frontend/app.js"></script></body></html>
