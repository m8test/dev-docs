<script src="static/search.js"></script></head><body data-id="automation" data-main-title="自动化" data-article-props="{&quot;seeAlsoStyle&quot;:&quot;links&quot;}" data-template="article" data-breadcrumbs=""><div class="wrapper"><main class="panel _main"><header class="panel__header"><div class="container"><h3>M8Test  Help</h3><div class="panel-trigger"></div></div></header><section class="panel__content"><div class="container"><article class="article" data-shortcut-switcher="inactive"><h1 data-toc="automation" id="automation.md">自动化</h1><p id="gkr3ds_3">M8Test 提供强大的设备自动化操作能力，部分操作需安装对应插件并授予特定权限（如无障碍服务、ADB 等）。支持的操作包括：</p><ul class="list _bullet" id="gkr3ds_4"><li class="list__item" id="gkr3ds_6"><p id="gkr3ds_15"><a href="automation-launch-app.html" id="gkr3ds_16" data-tooltip="权限: Adb">启动应用</a></p></li><li class="list__item" id="gkr3ds_7"><p id="gkr3ds_17"><a href="automation-click.html" id="gkr3ds_18" data-tooltip="权限: 无障碍服务">点击操作</a></p></li><li class="list__item" id="gkr3ds_8"><p id="gkr3ds_19"><a href="automation-set-text.html" id="gkr3ds_20" data-tooltip="权限: 无障碍服务">设置文本</a></p></li><li class="list__item" id="gkr3ds_9"><p id="gkr3ds_21"><a href="automation-swipe-up.html" id="gkr3ds_22" data-tooltip="权限: 无障碍服务">向上滑动</a></p></li><li class="list__item" id="gkr3ds_10"><p id="gkr3ds_23"><a href="automation-swipe-down.html" id="gkr3ds_24" data-tooltip="权限: 无障碍服务">向下滑动</a></p></li><li class="list__item" id="gkr3ds_11"><p id="gkr3ds_25"><a href="automation-swipe-left.html" id="gkr3ds_26" data-tooltip="权限: 无障碍服务">向左滑动</a></p></li><li class="list__item" id="gkr3ds_12"><p id="gkr3ds_27"><a href="automation-swipe-right.html" id="gkr3ds_28" data-tooltip="权限: 无障碍服务">向右滑动</a></p></li><li class="list__item" id="gkr3ds_13"><p id="gkr3ds_29"><a href="automation-back.html" id="gkr3ds_30" data-tooltip="权限: 无障碍服务">返回操作</a></p></li><li class="list__item" id="gkr3ds_14"><p id="gkr3ds_31"><a href="automation-home.html" id="gkr3ds_32" data-tooltip="权限: 无障碍服务">回到主页</a></p></li></ul><aside class="prompt" data-type="tip" data-title="" id="gkr3ds_5"><p id="gkr3ds_33">上面自动化操作只适用于物理屏幕(或其镜像屏幕)，如果需要在虚拟屏幕实现自动化操作请参考 <a href="virtual-display.html" id="gkr3ds_34" data-tooltip="在 M8Test 中使用虚拟屏幕功能时，无论通过以下哪种方式操作，都必须具备 adb 权限 或 root 权限：">虚拟屏幕</a> 章节。</p></aside><div class="last-modified">09 December 2025</div><div data-feedback-placeholder="true"></div><div class="navigation-links _bottom"><a href="webview-automation-bridge.html" class="navigation-links__prev">使用 WebViewBridge</a><a href="automation-launch-app.html" class="navigation-links__next">启动应用</a></div></article><div id="disqus_thread"></div></div></section></main></div><script src="frontend/app.js"></script></body></html>
