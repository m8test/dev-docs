<script src="static/search.js"></script></head><body data-id="script-engine" data-main-title="脚本引擎" data-article-props="{&quot;seeAlsoStyle&quot;:&quot;links&quot;}" data-template="article" data-breadcrumbs="script-introduction.md|脚本介绍"><div class="wrapper"><main class="panel _main"><header class="panel__header"><div class="container"><h3>M8Test  Help</h3><div class="panel-trigger"></div></div></header><section class="panel__content"><div class="container"><article class="article" data-shortcut-switcher="inactive"><h1 data-toc="script-engine" id="script-engine.md">脚本引擎</h1><p id="z8elur3_3">在 M8Test 中， <a href="https://sdk-docs.m8test.com/sdk/com.m8test.script.core.api.engine/-script-engine/index.html" id="z8elur3_5" data-external="true" rel="noopener noreferrer" target="_blank">脚本引擎</a> 用于启动脚本。</p><ul class="list _bullet" id="z8elur3_4"><li class="list__item" id="z8elur3_6"><p id="z8elur3_9">通过脚本引擎可启动多个脚本并对其运行状态进行控制，二者为一对多的关系。其中，第一个启动的脚本称为主脚本，其余则为子脚本。</p></li><li class="list__item" id="z8elur3_7"><p id="z8elur3_10">主脚本会在所有子脚本运行结束后才终止运行。 在脚本中，可通过 <a href="https://sdk-docs.m8test.com/sdk/com.m8test.script.core.api.engine/-script/get-engine.html" id="z8elur3_11" data-external="true" rel="noopener noreferrer" target="_blank">getEngine</a> 方法获取创建该脚本的脚本引擎。</p></li><li class="list__item" id="z8elur3_8"><p id="z8elur3_12">启动脚本时可以通过 <a href="https://sdk-docs.m8test.com/sdk/com.m8test.script.core.api.config/-script-config/set-standalone.html" id="z8elur3_13" data-external="true" rel="noopener noreferrer" target="_blank">setStandalone</a> 方法设置脚本是否独立运行在一个脚本引擎中。</p></li></ul><div class="last-modified">09 December 2025</div><div data-feedback-placeholder="true"></div><div class="navigation-links _bottom"><a href="script-introduction.html" class="navigation-links__prev">脚本介绍</a><a href="script-types.html" class="navigation-links__next">脚本类型</a></div></article><div id="disqus_thread"></div></div></section></main></div><script src="frontend/app.js"></script></body></html>
