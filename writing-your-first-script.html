</p><figure id="-crbibi_21"><img alt="8" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/8.png" title="8"></figure><p id="-crbibi_22">点击运行</p><figure id="-crbibi_23"><img alt="9" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/9.png" title="9"></figure><p id="-crbibi_24">到目前为止第一个脚本编写并成功运行了.</p><div class="last-modified">Last modified: 08 February 2025</div><div data-feedback-placeholder="true"></div><div class="navigation-links _bottom"><a href="getting-started.html" class="navigation-links__prev">快速入门</a><a href="install-language-plugin.html" class="navigation-links__next">安装语言插件</a></div></article><div id="disqus_thread"></div></div></section></main></div><script src="https://resources.jetbrains.com/writerside/apidoc/6.10.0-b267/app.js"></script></body></html>
