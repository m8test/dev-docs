钮</p><figure id="-r668gf_18"><img alt="8" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/8.png" title="8"></figure><p id="-r668gf_19">点击运行</p><figure id="-r668gf_20"><img alt="9" src="https://raw.githubusercontent.com/m8test/Images/refs/heads/main/9.png" title="9"></figure><p id="-r668gf_21">到目前为止第一个脚本编写并成功运行了.</p><div class="last-modified">Last modified: 16 April 2025</div><div data-feedback-placeholder="true"></div><div class="navigation-links _bottom"><a href="install-and-use-app.html" class="navigation-links__prev">安装和使用app</a><a href="script-command.html" class="navigation-links__next">脚本命令</a></div></article><div id="disqus_thread"></div></div></section></main></div><script src="https://resources.jetbrains.com/writerside/apidoc/6.22.0-b725/app.js"></script></body></html>
